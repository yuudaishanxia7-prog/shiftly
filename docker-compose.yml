services:
  db:
    image: postgres:17-alpine
    ports: ["${DB_PORT}:5432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [shiftly-db:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 10}
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL}
      DIRECT_URL: ${COMPOSE_DIRECT_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST}
      ENABLE_DEMO_MODE: ${ENABLE_DEMO_MODE}
      NEXT_PUBLIC_ENABLE_DEMO_MODE: ${NEXT_PUBLIC_ENABLE_DEMO_MODE}
      HOSTNAME: ${APP_HOSTNAME}
    depends_on: {db: {condition: service_healthy}}
volumes: {shiftly-db: {}}
